<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Brand Primary Gradient -->
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" /> <!-- Primary Indigo -->
      <stop offset="50%" stop-color="#a855f7" /> <!-- Accent Violet -->
      <stop offset="100%" stop-color="#ec4899" /> <!-- Pink/Magenta -->
    </linearGradient>
    <!-- Cyan Glow Accent Gradient -->
    <linearGradient id="glow-grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <!-- Subtle shadow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing background aura -->
  <circle cx="100" cy="100" r="80" fill="url(#logo-grad)" opacity="0.06" filter="url(#glow)"/>

  <!-- Logo Icon Shape: Modern AI Sparkle + Graduation Cap fusion -->
  <g>
    <!-- Outer Glow AI Sparkle (Gemini-style four-pointed star) -->
    <path d="M 100,15 Q 100,100 15,100 Q 100,100 100,185 Q 100,100 185,100 Q 100,100 100,15 Z" 
          fill="url(#logo-grad)" 
          filter="url(#glow)" 
          opacity="0.95" />

    <!-- Inner overlay spark for dimension and brightness -->
    <path d="M 100,40 Q 100,100 40,100 Q 100,100 100,160 Q 100,100 160,100 Q 100,100 100,40 Z" 
          fill="url(#glow-grad)" 
          opacity="0.4" />

    <!-- Stylized negative space/contrast graduation cap in the center core -->
    <!-- Academic Diamond -->
    <polygon points="100,75 125,85 100,95 75,85" fill="#ffffff" />
    
    <!-- Academic Cap Lower Stand/Arch -->
    <path d="M 85,91 L 85,101 C 85,109 115,109 115,101 L 115,91" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 90,100 C 90,104 110,104 110,100" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round" />

    <!-- Tassel hanging from center -->
    <path d="M 100,85 C 118,85 123,93 123,103 L 123,115" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <!-- Tassel Brush -->
    <polygon points="120,115 126,115 125,123 121,123" fill="#06b6d4" />
    
    <!-- Center glowing core of knowledge -->
    <circle cx="100" cy="85" r="3" fill="#06b6d4" />
  </g>
</svg>
