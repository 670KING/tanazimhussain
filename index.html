<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tanoedu AI - Premium AI-Powered Academic Assistant</title>
    <meta name="description" content="Tanoedu AI is an advanced educational platform powered by multiple state-of-the-art AI models. Create smart quizzes, generate study plans, summarize academic texts, and build resumes effortlessly." />
    <meta name="keywords" content="academic ai, study helper, quiz generator, study planner, document summarizer, AI resume builder, Tanoedu, Tanoedu AI" />
    <meta name="author" content="Tanoedu AI Team" />
    <meta name="robots" content="index, follow" />

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tanoedu-ai.web.app/" />
    <meta property="og:title" content="Tanoedu AI - Premium AI-Powered Academic Assistant" />
    <meta property="og:description" content="Study smarter with Tanoedu AI. Instantly generate study plans, custom quizzes, notes summaries, and resume building." />
    <meta property="og:image" content="https://tanoedu-ai.web.app/logo.svg" />
    <meta property="og:site_name" content="Tanoedu AI" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Tanoedu AI - AI Academic Tool" />
    <meta name="twitter:description" content="Study smarter with Tanoedu AI. Multiple AI models for chat, quiz generation, study planner, and documents summary." />
    <meta name="twitter:image" content="https://tanoedu-ai.web.app/logo.svg" />

    <!-- Performance: preconnect to font origins to reduce LCP render delay -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload the hero display font (Space Grotesk 500) used by the LCP text -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="https://fonts.gstatic.com/s/spacegrotesk/v22/V8mDoQDjQSkFtoMM3T6r8E7mPbF4C_k3HqU.woff2"
      crossorigin
    />

    <!-- Load Google Fonts non-blocking to avoid render-blocking critical request.
         Uses media="print" + onload swap; display=swap ensures fallback text shows immediately. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      />
    </noscript>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
